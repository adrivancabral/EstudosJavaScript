<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="title">Meu primeiro evento</h1>
    <button id="button">Clique aqui</button>
    <p></p>
    <form id="expenseForm">
        <label for="description">Descrição:</label>
        <input id="amount" type="text">

        <label for="amount">Valor:</label>
        <input type="number" id="amount">
        
        <button type="submit" id="button2">Cadastrar despesa</button>
    </form>
    <p id="message"></p>

    <label for="category">Categoria:</label>
    <select id="category">
        <option value="">Selecione uma categoria</option>
        <option value="food">Alimentação</option>
        <option value="car">Carro</option>
        <option value="health">Saúde</option>
    </select>
    <p id="selectedCategory"></p>

    <label for="expenseName">Nome da despesa</label>
    <input type="text" placeholder="Digite uma despesa" id="expenseName">
    <p id="preview"></p>
</body>
</html>
