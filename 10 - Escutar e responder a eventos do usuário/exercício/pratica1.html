<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="pratica1.js" defer></script>
</head>
<body>
    <h1 id="title">Controle Financeiro</h1>
    <form id="expenseForm">
        <label for="expenseName">Nome da despesa:</label>
        <input id="expenseName" type="text" placeholder="Digite uma despesa">
        <p></p>
        <label for="expenseAmount">Valor:</label>
        <input type="number" id="expenseAmount" placeholder="Digite o valor" step="0.01">
        <button type="submit">Cadastrar despesa</button>
    </form>
    <p id="message"></p>
</body>
</html>
